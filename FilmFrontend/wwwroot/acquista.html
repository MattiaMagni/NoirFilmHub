<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Acquista</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260508-global-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/callback-auth.js" defer></script>
  <script src="/js/seatmap-utils.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/acquista.js?v=20260508-stitch-5" defer></script>
</head>
<body class="screen-seat-selection">
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Acquisto</p>
        <h1 class="ops-title">Selezione posti</h1>
        <p class="ops-subtitle">Scegli i posti in sala e completa l'acquisto in sicurezza.</p>
      </div>
    </section>

    <div id="acquista-status" class="status info">Caricamento...</div>

    <section class="seat-layout">
      <aside id="acquista-summary" class="panel seat-movie-panel"></aside>

      <section class="panel seat-stage-panel">
        <div class="seat-screen-wrap">
          <div class="seat-screen"></div>
          <span class="seat-screen-label">SCREEN</span>
        </div>
        <p id="seat-lock-timer" class="subtle"></p>
        <div id="seat-grid" class="seat-grid"></div>
      </section>

      <aside class="panel seat-booking-panel">
        <h3>Riepilogo prenotazione</h3>
        <div class="seat-booking-lines">
          <p><span>Posti selezionati</span><strong id="selected-seats-count">0</strong></p>
          <p><span>Prezzo unitario</span><strong id="selected-seat-price">-</strong></p>
          <p><span>Supplemento VIP</span><strong id="selected-seat-vip-extra">-</strong></p>
          <p><span>Totale</span><strong id="selected-seats-total">-</strong></p>
        </div>
        <p id="seat-vip-note" class="seat-vip-note">I posti VIP costano piu del prezzo base.</p>
        <p id="selected-seats-list" class="subtle">Nessuno</p>
        <button id="acquista-add-cart" class="primary" type="button">Aggiungi al carrello</button>
      </aside>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireAuth(window.location.pathname + window.location.search)) {
        return;
      }
      await window.bootstrapLayout();
      await window.initAcquistaPage();
    });
  </script>
</body>
</html>
