<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Acquista</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260427-6">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/callback-auth.js" defer></script>
  <script src="/js/seatmap-utils.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/acquista.js?v=20260427-3" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Acquisto</p>
        <h1 class="ops-title">Selezione posti</h1>
        <p class="ops-subtitle">Scegli i posti in sala e completa l'acquisto in sicurezza.</p>
      </div>
    </section>

    <section class="panel">
      <div id="acquista-status" class="status info">Caricamento...</div>
      <article id="acquista-summary" class="panel"></article>
      <div class="panel">
        <h3>Piantina sala</h3>
        <p id="seat-lock-timer" class="subtle"></p>
        <div id="seat-grid" class="seat-grid"></div>
      </div>
      <div class="panel">
        <h4>Posti selezionati</h4>
        <p id="selected-seats-list" class="subtle">Nessuno</p>
        <div class="actions">
          <button id="acquista-continue" class="primary" type="button">Continua</button>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireAuth(window.location.pathname + window.location.search)) {
        return;
      }
      await window.bootstrapLayout();
      await window.initAcquistaPage();
    });
  </script>
</body>
</html>
