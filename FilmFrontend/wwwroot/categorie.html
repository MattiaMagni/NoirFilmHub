<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Categorie</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/categorie.js" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container page-shell">
    <h1 class="page-title">Gestione categorie</h1>
    <section class="panel">
      <h2>Crea / Modifica categoria</h2>
      <form id="categoria-form">
        <div class="form-grid">
          <div>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>
          </div>
          <div>
            <label for="descrizione">Descrizione</label>
            <input id="descrizione" name="descrizione" type="text">
          </div>
        </div>
        <div class="actions">
          <button id="categoria-submit" class="primary" type="submit">Crea categoria</button>
          <button id="categoria-cancel" class="secondary hidden" type="button">Annulla modifica</button>
        </div>
      </form>
      <div id="categorie-status" class="status info">In attesa operazioni...</div>
    </section>

    <section class="panel">
      <h2>Elenco categorie</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Descrizione</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="categorie-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireRole(["admin"])) {
        return;
      }
      await window.bootstrapLayout();
      window.initCategoriePage();
    });
  </script>
</body>
</html>
