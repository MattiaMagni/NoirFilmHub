<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Cinema</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/cinemas.js" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container page-shell">
    <section class="hero">
      <div class="hero-panel">
        <p class="eyebrow">Theaters</p>
        <h1>Gestione cinema</h1>
        <p>Configura sale e capienza per mantenere un'anagrafica pulita e allineata con la programmazione e le prenotazioni.</p>
      </div>
    </section>

    <section class="panel">
      <h2>Crea / Modifica cinema</h2>
      <form id="cinema-form">
        <div class="form-grid">
          <div>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>
          </div>
          <div>
            <label for="indirizzo">Indirizzo</label>
            <input id="indirizzo" name="indirizzo" type="text" required>
          </div>
          <div>
            <label for="citta">Citta</label>
            <input id="citta" name="citta" type="text" required>
          </div>
          <div>
            <label for="capienza">Capienza posti</label>
            <input id="capienza" name="capienza" type="number" min="20" max="500" step="1" value="120" required>
          </div>
        </div>
        <div class="actions">
          <button id="cinema-submit" class="primary" type="submit">Crea cinema</button>
          <button id="cinema-cancel" class="secondary hidden" type="button">Annulla modifica</button>
        </div>
      </form>
      <div id="cinemas-status" class="status info">In attesa operazioni...</div>
    </section>

    <section class="panel">
      <h2>Elenco cinema</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Indirizzo</th>
              <th>Citta</th>
              <th>Capienza</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="cinemas-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireRole(["admin"])) {
        return;
      }
      await window.bootstrapLayout();
      window.initCinemasPage();
    });
  </script>
</body>
</html>
