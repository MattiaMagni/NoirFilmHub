<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Cinema</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260508-global-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/modal-utils.js" defer></script>
  <script src="/js/cinemas.js?v=20260513-1" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Rete cinema</p>
        <h1 class="ops-title">Gestione cinema</h1>
        <p class="ops-subtitle">Configura sale e capienza per mantenere un'anagrafica pulita e allineata con la programmazione e le prenotazioni.</p>
      </div>
    </section>

    <section class="panel">
      <h2>Nuovo cinema o modifica</h2>
      <form id="cinema-form">
        <div class="form-grid">
          <div>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>
          </div>
          <div>
            <label for="indirizzo">Indirizzo</label>
            <input id="indirizzo" name="indirizzo" type="text" required>
          </div>
          <div>
            <label for="citta">Citta</label>
            <input id="citta" name="citta" type="text" required>
          </div>
          <div>
            <label for="capienza">Capienza posti</label>
            <input id="capienza" name="capienza" type="number" min="20" max="500" step="1" value="120" required>
          </div>
          <div>
            <label for="codiceLocale">Codice locale</label>
            <input id="codiceLocale" name="codiceLocale" type="text" placeholder="0131220507688" required>
          </div>
          <div>
            <label for="latitudine">Latitudine</label>
            <input id="latitudine" name="latitudine" type="number" step="0.000001">
          </div>
          <div>
            <label for="longitudine">Longitudine</label>
            <input id="longitudine" name="longitudine" type="number" step="0.000001">
          </div>
          <div>
            <label for="attivo">Stato</label>
            <select id="attivo" name="attivo">
              <option value="true">Attivo</option>
              <option value="false">Non attivo</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="cinema-submit" class="primary" type="submit">Crea cinema</button>
          <button id="cinema-cancel" class="secondary hidden" type="button">Annulla modifica</button>
        </div>
      </form>
      <div id="cinemas-status" class="status info">Seleziona un'operazione.</div>
    </section>

    <section class="panel">
      <h2>Elenco cinema</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Indirizzo</th>
              <th>Citta</th>
              <th>Capienza</th>
              <th>Codice locale</th>
              <th>Posizione</th>
              <th>Stato</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="cinemas-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireRole(["admin"])) {
        return;
      }
      await window.bootstrapLayout();
      window.initCinemasPage();
    });
  </script>
</body>
</html>
