<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Esito pagamento</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260508-global-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/esito-pagamento.js?v=20260427-4" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Pagamento</p>
        <h1 class="ops-title">Esito pagamento</h1>
        <p class="ops-subtitle">Riepilogo del tuo acquisto e dati del biglietto elettronico.</p>
      </div>
    </section>

    <section class="panel">
      <div id="esito-status" class="status info">Caricamento esito...</div>
      <div id="esito-body"></div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireAuth(window.location.pathname + window.location.search)) {
        return;
      }
      await window.bootstrapLayout();
      await window.initEsitoPagamentoPage();
    });
  </script>
</body>
</html>
