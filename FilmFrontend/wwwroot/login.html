<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js?v=20260407-1" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script>
    window.__loginGatePromise = (async () => {
      if (!window.AuthService || !window.AuthGuard) {
        return false;
      }
      return await window.AuthGuard.redirectIfAuthenticated("/profile.html");
    })();
  </script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container page-shell">
    <h1 class="page-title">Accedi</h1>
    <section class="panel" style="max-width: 520px;">
      <form id="login-form">
        <div class="form-grid">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Login</button>
          <a class="button secondary" href="/register.html">Registrati</a>
        </div>
      </form>
      <div id="login-status" class="status info">Inserisci le credenziali.</div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (window.__loginGatePromise && await window.__loginGatePromise) {
        return;
      }
      await window.bootstrapLayout();
      await window.initLoginPage();
    });
  </script>
</body>
</html>
