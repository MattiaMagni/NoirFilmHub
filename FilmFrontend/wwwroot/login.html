<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Login</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260508-global-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/login.js?v=20260511-1" defer></script>
</head>
<body>
  <div id="navbar-container"></div>
  <main class="container page-shell">
    <section class="hero">
      <div class="hero-panel">
        <p class="eyebrow">Accesso</p>
        <h1>Accedi</h1>
        <p>Entra nella tua area riservata per gestire profilo, prenotazioni e strumenti operativi in stile Noir Film Hub.</p>
      </div>
    </section>

    <section class="panel auth-panel">
      <h2>Email e password</h2>
      <form id="login-form">
        <div class="form-grid">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Login</button>
          <a class="button secondary" href="/register.html">Registrati</a>
        </div>
      </form>
      <p style="margin-top:8px;"><a href="/recupera-password.html">Password dimenticata?</a></p>
      <div id="login-status" class="status info">Inserisci le credenziali.</div>
    </section>

    <section class="panel auth-panel">
      <h2>Oppure accedi con</h2>
      <div class="actions" style="flex-wrap:wrap;gap:12px;">
        <button class="button secondary social-btn" id="btn-google" type="button">
          <svg class="social-logo" viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Accedi con Google
        </button>
        <button class="button secondary social-btn" id="btn-microsoft" type="button">
          <svg class="social-logo" viewBox="0 0 24 24" width="20" height="20"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="13" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="13" width="10" height="10" fill="#00A4EF"/><rect x="13" y="13" width="10" height="10" fill="#FFB900"/></svg>
          Accedi con Microsoft
        </button>
      </div>
      <div id="social-status" class="status subtle"></div>
    </section>
  </main>
  <div id="footer-container"></div>

  <style>
    .social-btn { display:inline-flex;align-items:center;gap:8px; }
    .social-logo { flex-shrink:0; }
  </style>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      var redirected = false;
      if (window.AuthGuard && window.AuthService) {
        try { redirected = await window.AuthGuard.redirectIfAuthenticated("/profile.html"); } catch {}
      }
      if (redirected) return;
      await window.bootstrapLayout();
      document.getElementById("btn-google").addEventListener("click", () => {
        if (window.AuthService) window.AuthService.initiateSocialLogin("google", "login");
      });
      document.getElementById("btn-microsoft").addEventListener("click", () => {
        if (window.AuthService) window.AuthService.initiateSocialLogin("microsoft", "login");
      });
      if (window.initLoginPage) window.initLoginPage();
    });
  </script>
</body>
</html>
