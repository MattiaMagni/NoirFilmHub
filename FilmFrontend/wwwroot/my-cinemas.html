<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - My Cinemas</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260427-6">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/callback-auth.js" defer></script>
  <script src="/js/programmazione-shared.js" defer></script>
  <script src="/js/date-utils.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/my-cinemas.js?v=20260426-1" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Rete cinema</p>
        <h1 class="ops-title">I nostri cinema</h1>
        <p class="ops-subtitle">Sfoglia i cinema disponibili e consulta la programmazione giornaliera per ogni sede.</p>
      </div>
    </section>

    <section class="panel">
      <div id="my-cinemas-status" class="status info">Caricamento...</div>
      <div id="my-cinemas-list" class="grid-cards"></div>

      <div id="my-cinemas-detail-shell" class="hidden">
        <h2 id="my-cinemas-detail-title" class="ops-section-head">Programmazione cinema</h2>
        <div class="date-strip-shell">
          <div id="my-cinemas-date-strip" class="date-strip"></div>
        </div>
        <div id="my-cinemas-day-body" class="my-cinemas-day-body"></div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      await window.bootstrapLayout();
      await window.initMyCinemasPage();
    });
  </script>
</body>
</html>
