<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Area Personale</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260508-global-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/profile.js?v=20260513-2" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Area personale</p>
        <h1 class="ops-title">Il tuo account</h1>
        <p class="ops-subtitle">Gestisci profilo, biglietti, gift card e preferenze.</p>
      </div>
    </section>

    <div id="profile-status" class="status info">Caricamento...</div>

    <div class="profile-layout">
      <!-- Sidebar -->
      <aside class="profile-sidebar panel">
        <h3>Profilo</h3>
        <form id="profile-form">
          <label>Email</label>
          <input id="profile-email" type="email" disabled>
          <label>Nome</label>
          <input id="profile-nome" type="text" required>
          <label>Cognome</label>
          <input id="profile-cognome" type="text" required>
          <label>Telefono</label>
          <input id="profile-telefono" type="text">
          <button class="button primary" type="submit" style="width:100%;margin-top:0.5rem">Salva modifiche</button>
        </form>

        <hr>
        <div id="security-section" style="display:none">
          <h4>Sicurezza</h4>
          <div id="security-content"></div>
        </div>
      </aside>

      <!-- Main content -->
      <section class="profile-main">
        <div class="profile-tabs">
          <button class="profile-tab active" data-tab="bookings">I miei biglietti</button>
          <button class="profile-tab" data-tab="giftcards">Gift Card</button>
        </div>

        <div id="tab-bookings" class="profile-tab-content">
          <table class="table">
            <thead><tr><th>ID</th><th>Film</th><th>Cinema</th><th>Data</th><th>Ora</th><th>Posti</th><th>Stato</th><th>Azioni</th></tr></thead>
            <tbody id="prenotazioni-body"></tbody>
          </table>
        </div>

        <div id="tab-giftcards" class="profile-tab-content hidden">
          <div id="giftcards-body"></div>
        </div>
      </section>
    </div>

    <!-- Change Password Modal -->
    <div id="change-password-modal" class="modal-overlay" style="display:none">
      <div class="modal-card">
        <h3>Cambia password</h3>
        <form id="change-password-form">
          <label>Password attuale</label>
          <input id="cp-current" type="password" required>
          <label>Nuova password</label>
          <div class="pw-row"><input id="cp-new" type="password" required minlength="8"><button type="button" class="btn-small secondary pw-toggle" data-target="cp-new" aria-label="Mostra password">👁</button></div>
          <label>Conferma password</label>
          <div class="pw-row"><input id="cp-new2" type="password" required minlength="8"><button type="button" class="btn-small secondary pw-toggle" data-target="cp-new2" aria-label="Mostra password">👁</button></div>
          <div id="cp-status" class="status"></div>
          <div class="actions">
            <button type="submit" class="button primary">Cambia password</button>
            <button type="button" id="cp-cancel" class="button secondary">Annulla</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireAuth(window.location.pathname)) return;
      await window.bootstrapLayout();
      await window.initProfilePage();
    });
  </script>
</body>
</html>
