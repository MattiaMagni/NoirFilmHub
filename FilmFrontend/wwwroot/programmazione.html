<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Programmazione</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260513-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/geo-permission.js?v=20260513-3" defer></script>
  <script src="/js/callback-auth.js" defer></script>
  <script src="/js/programmazione-shared.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/programmazione.js?v=20260513-2" defer></script>
</head>
<body class="screen-programmazione-grid">
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Film</p>
        <h1 class="ops-title">Programmazione film</h1>
        <p class="ops-subtitle">Filtra i film in evidenza, in uscita o tutto il catalogo e verifica subito se sono disponibili nel tuo cinema.</p>
      </div>
    </section>

    <section class="panel">
      <div class="programmazione-toolbar">
        <div class="actions">
          <input id="programmazione-search" type="search" placeholder="Cerca per titolo..." aria-label="Ricerca film">
          <select id="programmazione-category" aria-label="Filtro categoria">
            <option value="">Tutte le categorie</option>
          </select>
          <select id="choose-cinema-select" aria-label="Seleziona cinema">
            <option value="">Scegli cinema</option>
          </select>
        </div>
      </div>
      <p class="subtle">Cinema selezionato: <strong id="cinema-selezionato-badge">Cinema non selezionato</strong></p>
      <div id="programmazione-status" class="status info">Caricamento programmazione...</div>
      <div id="programmazione-cards" class="grid-cards"></div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      await window.bootstrapLayout();
      await window.initProgrammazionePage();
    });
  </script>
</body>
</html>
