<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Proiezioni</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260513-4">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/proiezioni.js?v=20260415-10" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Pianificazione</p>
        <h1 class="ops-title">Gestione proiezioni</h1>
        <p class="ops-subtitle">Pianifica la programmazione dei cinema per data e orario, mantenendo sotto controllo disponibilita e continuita delle sale.</p>
      </div>
    </section>

    <section class="panel">
      <h2 class="ops-section-head">Nuova proiezione o modifica</h2>
      <form id="proiezione-form">
        <div class="form-grid">
          <div>
            <label for="cinemaId">Cinema</label>
            <select id="cinemaId" name="cinemaId" required></select>
          </div>
          <div>
            <label for="filmId">Film</label>
            <select id="filmId" name="filmId" required></select>
          </div>
          <div>
            <label for="salaId">Sala</label>
            <select id="salaId" name="salaId" required></select>
          </div>
          <div>
            <label for="data">Data</label>
            <input id="data" name="data" type="date" required>
          </div>
          <div>
            <label for="ora">Ora</label>
            <input id="ora" name="ora" type="time" required>
          </div>
          <div>
            <label for="prezzoBase">Prezzo base</label>
            <input id="prezzoBase" name="prezzoBase" type="number" step="0.01" min="1" value="8.90" required>
          </div>
        </div>
        <div class="actions">
          <button id="proiezione-submit" class="primary" type="submit">Crea proiezione</button>
          <button id="proiezione-cancel" class="secondary hidden" type="button">Annulla modifica</button>
        </div>
      </form>
      <div id="proiezioni-status" class="status info">Seleziona un'operazione.</div>
    </section>

    <section class="panel">
      <h2 class="ops-section-head">Elenco proiezioni</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>CinemaId</th>
              <th>Sala</th>
              <th>FilmId</th>
              <th>Data</th>
              <th>Ora</th>
              <th>Prezzo</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="proiezioni-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireRole(["admin", "power_user"])) {
        return;
      }
      await window.bootstrapLayout();
      await window.initProiezioniPage();
    });
  </script>
</body>
</html>
