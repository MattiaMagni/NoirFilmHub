<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineBase - Recupera Password</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260513-4">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
</head>
<body>
  <div id="navbar-container"></div>
  <main class="container page-shell">
    <section class="hero">
      <div class="hero-panel">
        <p class="eyebrow">Password dimenticata</p>
        <h1>Recupera Password</h1>
        <p>Inserisci la tua email per ricevere un link di recupero.</p>
      </div>
    </section>
    <section class="panel auth-panel">
      <form id="forgot-form">
        <div class="form-grid">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Invia link di recupero</button>
          <a class="button secondary" href="/login.html">Torna al login</a>
        </div>
      </form>
      <div id="forgot-status" class="status info">Inserisci la tua email.</div>
      <div id="direct-link-container" style="display:none;margin-top:16px;">
        <p style="margin-bottom:8px;">L'email non e stata recapitata. Usa il link diretto:</p>
        <a id="direct-link" href="#" class="button primary">Reimposta password</a>
      </div>
    </section>
  </main>
  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      await window.bootstrapLayout();
      const form = document.getElementById("forgot-form");
      const statusEl = document.getElementById("forgot-status");
      const linkContainer = document.getElementById("direct-link-container");
      const directLink = document.getElementById("direct-link");
      let attempts = 0;
      let cooldown = 0;

      function setStatus(msg, kind) { statusEl.className = "status " + kind; statusEl.textContent = msg; }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (cooldown > Date.now()) {
          const wait = Math.ceil((cooldown - Date.now()) / 1000);
          setStatus("Troppi tentativi. Riprova tra " + wait + " secondi.", "error");
          return;
        }
        const email = form.email.value.trim();
        if (!email) { setStatus("Inserisci un'email valida.", "error"); return; }
        setStatus("Invio in corso...", "info");
        linkContainer.style.display = "none";
        try {
          const result = await window.AuthService.forgotPassword(email);
          attempts++;
          if (attempts >= 3) cooldown = Date.now() + 60000;
          setStatus(result.message || "Email inviata.", "success");
          if (result.token && result.email) {
            const baseUrl = window.AppConfig && window.AppConfig.API_BASE_URL ? "" : "";
            const href = "/reimposta-password.html?token=" + encodeURIComponent(result.token) + "&email=" + encodeURIComponent(result.email);
            directLink.href = href;
            linkContainer.style.display = "block";
          }
        } catch (error) {
          if (error.status === 429) {
            cooldown = Date.now() + (error.retryAfter || 60) * 1000;
          }
          setStatus(error.message || "Errore durante l'invio.", "error");
        }
      });
    });
  </script>
</body>
</html>
