<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Registrazione</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260513-3">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/register.js" defer></script>
</head>
<body>
  <div id="navbar-container"></div>
  <main class="container page-shell">
    <section class="hero">
      <div class="hero-panel">
        <p class="eyebrow">Nuovo account</p>
        <h1>Registrati</h1>
        <p>Crea il tuo account per accedere all'area personale e gestire in modo semplice prenotazioni e dati di contatto.</p>
      </div>
    </section>

    <section class="panel auth-panel-wide">
      <h2>Email e password</h2>
      <form id="register-form">
        <div class="form-grid">
          <div>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>
          </div>
          <div>
            <label for="cognome">Cognome</label>
            <input id="cognome" name="cognome" type="text" required>
          </div>
          <div>
            <label for="telefono">Telefono</label>
            <input id="telefono" name="telefono" type="text">
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" required minlength="8">
              <button type="button" class="pw-toggle" tabindex="-1" aria-label="Mostra password"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div>
            <label for="password2">Conferma password</label>
            <div class="pw-wrap">
              <input id="password2" name="password2" type="password" required minlength="8">
              <button type="button" class="pw-toggle" tabindex="-1" aria-label="Mostra password"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Crea account</button>
          <a class="button secondary" href="/login.html">Hai gia un account?</a>
        </div>
      </form>
      <div id="register-status" class="status info">Compila i dati per registrarti.</div>
    </section>

    <section class="panel auth-panel">
      <h2>Oppure registrati con</h2>
      <div class="actions" style="flex-wrap:wrap;gap:12px;">
        <button class="button secondary social-btn" id="btn-google" type="button">
          <svg class="social-logo" viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Registrati con Google
        </button>
        <button class="button secondary social-btn" id="btn-microsoft" type="button">
          <svg class="social-logo" viewBox="0 0 24 24" width="20" height="20"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="13" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="13" width="10" height="10" fill="#00A4EF"/><rect x="13" y="13" width="10" height="10" fill="#FFB900"/></svg>
          Registrati con Microsoft
        </button>
      </div>
    </section>
  </main>
  <div id="footer-container"></div>

  <style>
    .social-btn { display:inline-flex;align-items:center;gap:8px; }
    .social-logo { flex-shrink:0; }
    .pw-wrap { position:relative;display:flex; }
    .pw-wrap input { width:100%;padding-right:40px; }
    .pw-toggle { position:absolute;right:0;top:0;bottom:0;width:40px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-text-secondary);font-size:16px; }
    .pw-toggle:hover { color:var(--color-text); }
  </style>

  <script>
    function initPasswordToggles() {
      document.querySelectorAll(".pw-toggle").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var input = this.closest(".pw-wrap").querySelector("input");
          var show = input.type === "password";
          input.type = show ? "text" : "password";
          this.querySelector("svg").innerHTML = show
            ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });
      });
    }
  </script>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      var redirected = false;
      if (window.AuthGuard && window.AuthService) {
        try { redirected = await window.AuthGuard.redirectIfAuthenticated("/profile.html"); } catch {}
      }
      if (redirected) return;
      await window.bootstrapLayout();
      document.getElementById("btn-google").addEventListener("click", () => {
        if (window.AuthService) window.AuthService.initiateSocialLogin("google", "login");
      });
      document.getElementById("btn-microsoft").addEventListener("click", () => {
        if (window.AuthService) window.AuthService.initiateSocialLogin("microsoft", "login");
      });
      if (window.initRegisterPage) window.initRegisterPage();
      initPasswordToggles();
    });
  </script>
</body>
</html>
