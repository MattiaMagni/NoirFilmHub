<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Registrazione</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script>
    window.__registerGatePromise = (async () => {
      if (!window.AuthService || !window.AuthGuard) {
        return false;
      }
      return await window.AuthGuard.redirectIfAuthenticated("/profile.html");
    })();
  </script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/register.js" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container page-shell">
    <section class="hero">
      <div class="hero-panel">
        <p class="eyebrow">Create account</p>
        <h1>Registrati</h1>
        <p>Crea il tuo account per accedere all'area personale e gestire in modo semplice prenotazioni e dati di contatto.</p>
      </div>
    </section>

    <section class="panel" style="max-width: 720px;">
      <form id="register-form">
        <div class="form-grid">
          <div>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>
          </div>
          <div>
            <label for="cognome">Cognome</label>
            <input id="cognome" name="cognome" type="text" required>
          </div>
          <div>
            <label for="telefono">Telefono</label>
            <input id="telefono" name="telefono" type="text">
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
          </div>
          <div>
            <label for="password2">Conferma password</label>
            <input id="password2" name="password2" type="password" required>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Crea account</button>
          <a class="button secondary" href="/login.html">Hai gia un account?</a>
        </div>
      </form>
      <div id="register-status" class="status info">Compila i dati per registrarti.</div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (window.__registerGatePromise && await window.__registerGatePromise) {
        return;
      }
      await window.bootstrapLayout();
      await window.initRegisterPage();
    });
  </script>
</body>
</html>
