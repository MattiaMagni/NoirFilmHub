<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineBase - Imposta Password</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260508-global-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
</head>
<body>
  <div id="navbar-container"></div>
  <main class="container page-shell">
    <section class="hero">
      <div class="hero-panel">
        <p class="eyebrow">Imposta password</p>
        <h1>Imposta la tua Password</h1>
        <p>Crea una password per il tuo account CineBase.</p>
      </div>
    </section>
    <section class="panel auth-panel">
      <form id="setup-form">
        <div class="form-grid">
          <div>
            <label for="password">Nuova password</label>
            <input id="password" name="password" type="password" required minlength="8">
            <small id="password-hint" class="subtle"></small>
          </div>
          <div>
            <label for="password2">Conferma password</label>
            <input id="password2" name="password2" type="password" required minlength="8">
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Imposta password</button>
        </div>
      </form>
      <div id="setup-status" class="status info">Scegli una password per il tuo account.</div>
    </section>
  </main>
  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      await window.bootstrapLayout();
      const form = document.getElementById("setup-form");
      const statusEl = document.getElementById("setup-status");
      const hintEl = document.getElementById("password-hint");
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const email = params.get("email");

      if (!token || !email) {
        statusEl.className = "status error";
        statusEl.textContent = "Link non valido. Contatta l'amministratore.";
        if (form) form.style.display = "none";
        return;
      }

      function checkStrength(pw) {
        if (!pw) return "";
        const checks = [];
        if (pw.length < 8) checks.push("minimo 8 caratteri");
        if (!/[A-Z]/.test(pw)) checks.push("1 maiuscola");
        if (!/[a-z]/.test(pw)) checks.push("1 minuscola");
        if (!/[0-9]/.test(pw)) checks.push("1 numero");
        if (!/[^A-Za-z0-9]/.test(pw)) checks.push("1 carattere speciale");
        return checks.length ? "Manca: " + checks.join(", ") : "Password valida";
      }

      document.getElementById("password").addEventListener("input", function () {
        hintEl.textContent = checkStrength(this.value);
        hintEl.className = this.value && checkStrength(this.value) === "Password valida" ? "status success" : "subtle";
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = form.password.value;
        const pw2 = form.password2.value;
        if (!pw || pw.length < 8) { statusEl.className = "status error"; statusEl.textContent = "Password troppo corta."; return; }
        if (pw !== pw2) { statusEl.className = "status error"; statusEl.textContent = "Le password non coincidono."; return; }
        statusEl.className = "status info"; statusEl.textContent = "Impostazione password in corso...";
        try {
          await window.AuthService.setupPassword(email, token, pw);
          statusEl.className = "status success";
          statusEl.textContent = "Password impostata con successo! Reindirizzamento in corso...";
          setTimeout(() => window.location.replace("/login.html"), 2000);
        } catch (error) {
          statusEl.className = "status error";
          statusEl.textContent = error.message || "Errore durante l'impostazione.";
        }
      });
    });
  </script>
</body>
</html>
