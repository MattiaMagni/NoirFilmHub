<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - TMDB Admin</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260508-global-2">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/tmdb-admin.js?v=20260426-1" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-shell ops-shell">
    <section class="ops-top-hero">
      <div>
        <p class="eyebrow">Sincronizzazione metadati</p>
        <h1 class="ops-title">Integrazione TMDB</h1>
        <p class="ops-subtitle">Sincronizza trailer, cast, descrizioni e metadati esterni dei film.</p>
      </div>
    </section>

    <section class="panel">
      <div class="actions">
        <button id="tmdb-run-batch" class="primary" type="button">Sync batch</button>
        <button id="tmdb-refresh" class="secondary" type="button">Aggiorna lista</button>
      </div>
      <div id="tmdb-admin-status" class="status info">Caricamento stato TMDB...</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Titolo</th>
              <th>TMDB ID</th>
              <th>Stato sync</th>
              <th>Ultima sync</th>
              <th>Azione</th>
            </tr>
          </thead>
          <tbody id="tmdb-admin-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireRole(["admin", "power_user"], window.location.pathname + window.location.search)) {
        return;
      }
      await window.bootstrapLayout();
      await window.initTmdbAdminPage();
    });
  </script>
</body>
</html>
