<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Gestione Utenti</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260513-3">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js?v=20260409-1" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/utenti.js?v=20260510-1" defer></script>
</head>
<body>
  <div id="navbar-container"></div>
  <main class="container page-shell">
    <section class="hero">
      <div class="hero-panel">
        <p class="eyebrow">Amministrazione</p>
        <h1>Gestione Utenti</h1>
        <p>Visualizza, cerca, filtra e gestisci tutti gli utenti della piattaforma.</p>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Cerca per nome, email..." style="flex:1;max-width:300px;">
        <select id="filter-ruolo">
          <option value="">Tutti i ruoli</option>
          <option value="admin">Admin</option>
          <option value="power_user">PowerUser</option>
          <option value="utente">Utente</option>
        </select>
        <select id="filter-status">
          <option value="">Tutti gli stati</option>
          <option value="disabled">Solo disabilitati</option>
          <option value="social">Solo account social</option>
        </select>
        <button class="primary" id="btn-invite">Invita Utente</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Ruolo</th>
              <th>Provider</th>
              <th>Stato</th>
              <th>Ultimo Accesso</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="utenti-table-body"></tbody>
        </table>
      </div>
      <div id="pagination" class="actions" style="justify-content:center;margin-top:16px;"></div>
      <div id="utenti-status" class="status info">Caricamento utenti...</div>
    </section>
  </main>
  <div id="footer-container"></div>

  <!-- Invite Modal -->
  <div id="invite-modal" class="modal-overlay" style="display:none;">
    <div class="modal-panel">
      <h3>Invita Nuovo Utente</h3>
      <form id="invite-form">
        <div class="form-grid">
          <div>
            <label for="inv-email">Email</label>
            <input id="inv-email" type="email" required>
          </div>
          <div>
            <label for="inv-ruolo">Ruolo</label>
            <select id="inv-ruolo"><option value="power_user">PowerUser</option><option value="admin">Admin</option></select>
          </div>
          <div>
            <label for="inv-nome">Nome</label>
            <input id="inv-nome" type="text" required>
          </div>
          <div>
            <label for="inv-cognome">Cognome</label>
            <input id="inv-cognome" type="text" required>
          </div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Invia invito</button>
          <button class="button secondary" type="button" id="inv-cancel">Annulla</button>
        </div>
      </form>
      <div id="inv-status" class="status subtle"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal-overlay" style="display:none;">
    <div class="modal-panel" style="max-width:600px;">
      <h3>Dettaglio Utente</h3>
      <div id="detail-content"></div>
      <div class="actions" style="margin-top:16px;">
        <button class="button secondary" type="button" id="detail-close">Chiudi</button>
      </div>
    </div>
  </div>

  <style>
    .modal-overlay { position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000; }
    .modal-panel { background:var(--bg-panel);padding:24px;border-radius:8px;max-width:450px;width:90%;max-height:90vh;overflow-y:auto; }
    .toolbar { display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center; }
    .toolbar input, .toolbar select { padding:8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-input);color:var(--text); }
  </style>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireAdmin()) return;
      await window.bootstrapLayout();
      await window.initUtentiPage();
    });
  </script>
</body>
</html>
