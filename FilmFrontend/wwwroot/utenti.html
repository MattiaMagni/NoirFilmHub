<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noir Film Hub - Gestione utenti</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/api-config.js" defer></script>
  <script src="/js/api-client.js" defer></script>
  <script src="/js/auth-service.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/template-loader.js" defer></script>
  <script src="/js/navbar.js" defer></script>
  <script src="/js/utenti.js?v=20260407-1" defer></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container page-shell">
    <h1 class="page-title">Gestione utenti</h1>
    <section class="panel">
      <div id="utenti-status" class="status info">Caricamento utenti...</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Email</th>
              <th>Nome</th>
              <th>Cognome</th>
              <th>Telefono</th>
              <th>Ruolo</th>
              <th>Azione</th>
            </tr>
          </thead>
          <tbody id="utenti-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      if (!window.AuthGuard || !window.AuthGuard.requireRole(["admin"])) {
        return;
      }
      await window.bootstrapLayout();
      await window.initUtentiPage();
    });
  </script>
</body>
</html>
