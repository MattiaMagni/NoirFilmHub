version: '3.8'
services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb-dev
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  stripe-listener:
    image: stripe/stripe-cli:latest
    container_name: stripe-listener
    profiles: ["stripe"]
    env_file:
      - .env
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to http://host.docker.internal:5000/pagamenti/stripe/webhook
    restart: unless-stopped

volumes:
  mariadb_data:
