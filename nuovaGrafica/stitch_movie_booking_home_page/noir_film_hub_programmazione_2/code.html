<!DOCTYPE html>

<html lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Noir Film Hub - Programmazione film</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'noir-red': '#E50914',
            'noir-dark': '#121212',
            'noir-glass': 'rgba(255, 255, 255, 0.05)',
            'noir-border': 'rgba(255, 255, 255, 0.1)',
          },
          boxShadow: {
            'red-glow': '0 0 25px 5px rgba(229, 9, 20, 0.4)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: CustomStyles -->
<style data-purpose="layout-and-effects">
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Glassmorphism effect for the filter bar */
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Card background with gradient overlay */
    .movie-card-overlay {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 60%);
    }

    /* Custom scrollbar for better dark mode aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0d0d;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
  </style>
<!-- END: CustomStyles -->
</head>
<body class="min-h-screen">
<!-- BEGIN: MainHeader -->
<header class="sticky top-0 z-50 bg-[#0d0d0d]/90 backdrop-blur-md px-4 md:px-12 py-4 flex items-center justify-between border-b border-white/5">
<div class="flex items-center gap-10">
<!-- Logo Container -->
<div class="flex items-center gap-2 cursor-pointer" data-purpose="logo">
<img alt="Noir Film Hub Logo" class="h-8 w-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJpTIaR6Nvs0kC_YiP84YX4LELnIUbWgB4ZpLIzpcShOMSSvdtX88fIjZvMfw1APbiZ-iLrXRs7_eKOaT6KphcFvSIitP9aFmoYZIWbVkZcho97EK0szNUKztnc4kKH6gQoZqZvmvYnFe5vuL768dRfV5GpGGBYtHnbzv4Pm44HXDLICFaDMyqPXiLae1ly28l3xcJfZ3ebUAGDGAHBU9lB4nT8UFKgSw71Ew4KAJ1fw_3H74vgvAo7pqKlQQu2spqDl0HYdBFvajs"/>
<span class="text-xl font-bold tracking-tight">Noir Film Hub</span>
</div>
<!-- Navigation Links -->
<nav class="hidden lg:flex items-center gap-8 text-sm font-semibold tracking-wider">
<a class="hover:text-noir-red transition-colors" href="#">HOME</a>
<a class="text-white border-b-2 border-noir-red pb-1" href="#">PROGRAMMAZIONE</a>
<a class="hover:text-noir-red transition-colors" href="#">CINEMA</a>
<a class="hover:text-noir-red transition-colors" href="#">GESTIONE</a>
</nav>
</div>
<!-- Header Actions -->
<div class="flex items-center gap-6 text-sm font-medium">
<div class="flex items-center gap-3">
<span class="text-gray-400">Tema chiaro</span>
<button class="w-10 h-5 bg-gray-700 rounded-full relative p-1 transition-colors">
<div class="absolute right-1 top-1 w-3 h-3 bg-white rounded-full"></div>
</button>
</div>
<a class="hover:underline" href="#">AREA PERSONALE</a>
<a class="hover:underline text-gray-400" href="#">Logout</a>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: HeroSection -->
<main class="max-w-7xl mx-auto px-4 md:px-12 pt-16 pb-12">
<div class="mb-10">
<h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Programmazione film</h1>
<p class="text-gray-400 max-w-2xl leading-relaxed">
        Filtra i film in evidenza, in uscita o tutto il catalogo e verifica subito se sono disponibili nel tuo cinema.
      </p>
</div>
<!-- BEGIN: FilterBar -->
<div class="glass-panel rounded-2xl p-4 flex flex-col md:flex-row items-center gap-4 mb-16" data-purpose="filter-bar">
<!-- Search Input -->
<div class="relative flex-1 w-full">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 text-white pl-12 placeholder-gray-500" placeholder="Cerca per titolo..." type="text"/>
<div class="absolute bottom-0 left-12 right-4 border-b border-gray-600"></div>
</div>
<!-- Category Selector -->
<div class="relative w-full md:w-64">
<select class="w-full bg-noir-glass border border-white/10 rounded-lg py-2.5 px-4 appearance-none focus:ring-0 text-gray-300">
<option>Tutte le categorie</option>
</select>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
<!-- Cinema Selector -->
<div class="relative w-full md:w-80">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-10V4m0 10V4m-5 11h3m0 0h5m-9 0H3m2 0h5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<select class="w-full bg-noir-glass border border-white/10 rounded-lg py-2.5 pl-11 pr-4 appearance-none focus:ring-0 text-gray-300">
<option>Noir Cinemas Lissone - Lissone</option>
</select>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
<!-- Results Info -->
<div class="px-4">
<span class="text-noir-red font-bold whitespace-nowrap">Caricati 1 film</span>
</div>
</div>
<!-- END: FilterBar -->
<!-- BEGIN: MovieGrid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8" data-purpose="movie-grid">
<!-- Card 1 (Normal) -->
<div class="relative rounded-2xl overflow-hidden group aspect-[2/3] cursor-pointer">
<img alt="Oppenheimer" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4xp3RKAVnuvg61GNrXOsYZy8c9ckBRodpk_8WtCoxPza29urzVYDXG16YqX1hziMQ9lqCEtf4x6_ygUXv-5qpOLbzYc-19pD9Kgi_ar4CntSlWn-mHFDaj0KPUH61evDUAQLbNlQ-nyaXATCB271GkzG9tACFdgl939pAaSgRyVspZ404KGLvqkAEz67aLgnPD2gnt_f_zTeP2kji5pGEF6bO3wfw1l_wyFGL5uhO6LVvHYJUzDLGkKiSHDyEAqMV88UO2a7MFvdS"/>
<div class="movie-card-overlay absolute inset-0 flex flex-col justify-end p-6">
<h3 class="text-2xl font-bold tracking-widest uppercase">Oppenheimer</h3>
</div>
</div>
<!-- Card 2 (Active/Selected with Glow) -->
<div class="relative rounded-2xl overflow-hidden group aspect-[2/3] cursor-pointer shadow-red-glow ring-2 ring-noir-red">
<img alt="Oppenheimer Active" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4xp3RKAVnuvg61GNrXOsYZy8c9ckBRodpk_8WtCoxPza29urzVYDXG16YqX1hziMQ9lqCEtf4x6_ygUXv-5qpOLbzYc-19pD9Kgi_ar4CntSlWn-mHFDaj0KPUH61evDUAQLbNlQ-nyaXATCB271GkzG9tACFdgl939pAaSgRyVspZ404KGLvqkAEz67aLgnPD2gnt_f_zTeP2kji5pGEF6bO3wfw1l_wyFGL5uhO6LVvHYJUzDLGkKiSHDyEAqMV88UO2a7MFvdS"/>
<div class="movie-card-overlay absolute inset-0 flex flex-col justify-end items-center p-6 text-center">
<div class="mb-4">
<h3 class="text-2xl font-bold tracking-widest uppercase">Oppenheimer</h3>
<p class="text-noir-red text-xs font-bold uppercase tracking-widest mt-1">DRAMMATICO</p>
</div>
<button class="bg-noir-red hover:bg-red-700 text-white font-bold py-2 px-8 rounded-full transition-all duration-300 text-sm">
            Prenota
          </button>
</div>
</div>
<!-- Card 3 (Normal) -->
<div class="relative rounded-2xl overflow-hidden group aspect-[2/3] cursor-pointer">
<img alt="Oppenheimer" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4xp3RKAVnuvg61GNrXOsYZy8c9ckBRodpk_8WtCoxPza29urzVYDXG16YqX1hziMQ9lqCEtf4x6_ygUXv-5qpOLbzYc-19pD9Kgi_ar4CntSlWn-mHFDaj0KPUH61evDUAQLbNlQ-nyaXATCB271GkzG9tACFdgl939pAaSgRyVspZ404KGLvqkAEz67aLgnPD2gnt_f_zTeP2kji5pGEF6bO3wfw1l_wyFGL5uhO6LVvHYJUzDLGkKiSHDyEAqMV88UO2a7MFvdS"/>
<div class="movie-card-overlay absolute inset-0 flex flex-col justify-end p-6">
<h3 class="text-2xl font-bold tracking-widest uppercase">Oppenheimer</h3>
</div>
</div>
<!-- Card 4 (Visible on larger screens) -->
<div class="hidden xl:block relative rounded-2xl overflow-hidden group aspect-[2/3] cursor-pointer">
<img alt="Oppenheimer" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4xp3RKAVnuvg61GNrXOsYZy8c9ckBRodpk_8WtCoxPza29urzVYDXG16YqX1hziMQ9lqCEtf4x6_ygUXv-5qpOLbzYc-19pD9Kgi_ar4CntSlWn-mHFDaj0KPUH61evDUAQLbNlQ-nyaXATCB271GkzG9tACFdgl939pAaSgRyVspZ404KGLvqkAEz67aLgnPD2gnt_f_zTeP2kji5pGEF6bO3wfw1l_wyFGL5uhO6LVvHYJUzDLGkKiSHDyEAqMV88UO2a7MFvdS"/>
<div class="movie-card-overlay absolute inset-0 flex flex-col justify-end p-6">
<h3 class="text-2xl font-bold tracking-widest uppercase">Oppenheimer</h3>
</div>
</div>
</div>
<!-- END: MovieGrid -->
</main>
<!-- END: HeroSection -->
</body></html>
